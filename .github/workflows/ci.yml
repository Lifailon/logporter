name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      Test:
        description: "Go unit test"
        default: true
        type: boolean
      Lint:
        description: "Golangci lint check"
        default: true
        type: boolean
      Check:
        description: "Run container and check metrics"
        default: true
        type: boolean
      Count:
        description: 'Number of verification cycles'
        type: string
        default: '5'
      Interval:
        description: 'Interval between cycles'
        type: string
        default: '15'
      Publish:
        description: "Publish image to Docker Hub"
        default: false
        type: boolean
      Latest:
        description: "Update latest tag"
        default: false
        type: boolean
      Tag:
        description: "Add custom tag for image"
        required: false
        default: "nightly"

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25

      - name: Go Verifier
        run: |
          go vet ./...
          go build ./...

      - name: Go unit test
        if: ${{ github.event.inputs.Test == 'true' }}
        run: go test -json ./... > test.json

      - name: Publish test report to GitHub Summary
        if: ${{ github.event.inputs.Test == 'true' }}
        run: |
          go install github.com/mfridman/tparse@latest
          tparse -all -format=markdown -file test.json >> $GITHUB_STEP_SUMMARY

      - name: Golangci lint check
        if: ${{ github.event.inputs.Lint == 'true' }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Install Docker Compose
        if: ${{ github.event.inputs.Check == 'true' }}
        run: |
          mkdir -p $HOME/.local/bin
          version=$(curl -s https://api.github.com/repos/docker/compose/releases/latest | jq -r .tag_name)
          curl -sSL "https://github.com/docker/compose/releases/download/$version/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          mkdir -p $HOME/.docker/cli-plugins
          cp /usr/local/bin/docker-compose $HOME/.docker/cli-plugins/docker-compose
          docker compose version

      - name: Run prometheus compose service
        if: ${{ github.event.inputs.Check == 'true' }}
        run: |
          sed -i "s|logporter:9333|localhost:9333|" prometheus/prometheus.yml
          docker compose up -d prometheus

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: |
          docker buildx build \
            -t lifailon/logporter:latest \
            --load .
          docker image ls

      - name: Run logporter container
        if: ${{ github.event.inputs.Check == 'true' }}
        run: |
          docker run -d --name logporter \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -p 9333:9333 \
            --restart=always \
            -e "LOG_LEVEL=debug" \
            lifailon/logporter:latest

      - name: Check metrics
        if: ${{ github.event.inputs.Check == 'true' }}
        env:
          LOOP_COUNT: ${{ github.event.inputs.Count }}
          SLEEP_INTERVAL: ${{ github.event.inputs.Interval }}
        run: |
          curl -sS localhost:9333/metrics
          for i in $(seq 1 $LOOP_COUNT); do
            curl -sS localhost:9333/metrics | grep 'containerName="logporter"' | grep docker_cpu_usage_total
            sleep $SLEEP_INTERVAL
          done
          curl -sS localhost:9333/metrics

      - name: Get docker logs and clean
        if: ${{ github.event.inputs.Check == 'true' }}
        run: |
          docker logs logporter
          docker stop logporter && docker rm logporter && docker compose down

      - name: Login to Docker Hub
        if: ${{ github.event.inputs.Publish == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish image to Docker Hub
        if: ${{ github.event.inputs.Publish == 'true' }}
        run: |
          TAGS=()
          if [ "${{ github.event.inputs.Latest }}" = "true" ]; then
            TAGS+=("-t" "lifailon/logporter:latest")
          fi          
          CUSTOM_TAG="${{ github.event.inputs.Tag }}"
          if [ -n "$CUSTOM_TAG" ]; then
            TAGS+=("-t" "lifailon/logporter:$CUSTOM_TAG")
          fi
          if [ ${#TAGS[@]} -eq 0 ]; then
            echo "No tags selected for build"
            exit 0
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            "${TAGS[@]}" \
            --push .
