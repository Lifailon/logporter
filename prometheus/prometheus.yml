rule_files:
  - alert.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: logporter
    scrape_interval: 15s
    scrape_timeout: 2s
    static_configs:
      - targets:
        - logporter:9333

  - job_name: cadvisor
    scrape_interval: 15s
    scrape_timeout: 2s
    static_configs:
      - targets:
        - cadvisor:8080