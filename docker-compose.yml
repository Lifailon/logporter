services:
  logporter:
    image: lifailon/logporter:latest
    build: .
    container_name: logporter
    restart: always
    ports:
      - 9333:9333
    environment:
      - LOG_LEVEL=info
      - DOCKER_METRICS_PORT=9333
      - DOCKER_METRICS_HOSTNAME=
      - DOCKER_METRICS_CUSTOM_LABELS=org.opencontainers.image.url,org.opencontainers.image.version,org.opencontainers.image.created
      - DOCKER_METRICS_CACHE=15 # 15s
      - DOCKER_METRICS_VOLUME=true
      - DOCKER_METRICS_VOLUME_CACHE=30 # 30m
      - DOCKER_METRICS_IMAGE_UPDATE=true
      - DOCKER_METRICS_IMAGE_INTERVAL=30 # 30m
      # Remove the LOKI_URL variable or leave it empty to disable log collection
      - LOKI_URL=http://loki:3100
      # Optional: basic auth and tenant
      # - LOKI_USERNAME=
      # - LOKI_PASSWORD=
      # - LOKI_TENANT_ID=
      - LOKI_PUSH_SECONDS=5
      - LOKI_PUSH_LINES=1000
      - LOKI_BUFFER_LINES=10000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - 9090:9090
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert/rules.yml:/etc/prometheus/alert.yml

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - 3100:3100
    volumes:
      - loki_data:/loki

volumes:
  grafana_data:
  prometheus_data:
  loki_data: