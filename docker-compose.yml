services:
  logporter:
    image: lifailon/logporter:latest
    build: .
    container_name: logporter
    restart: always
    ports:
      - 9333:9333
    environment:
      - DOCKER_METRICS_PORT=9333
      - DOCKER_METRICS_HOSTNAME=
      - DOCKER_METRICS_CACHE=15 # 15s
      - DOCKER_METRICS_VOLUME=true
      - DOCKER_METRICS_VOLUME_CACHE=30 # 30m
      # Remove the LOKI_URL variable or leave it empty to disable log collection
      - LOKI_URL=http://loki:3100
      # Optional: basic auth and tenant
      # - LOKI_USERNAME=
      # - LOKI_PASSWORD=
      # - LOKI_TENANT_ID=
      - LOKI_PUSH_SECONDS=5
      - LOKI_PUSH_LINES=1000
      - LOKI_BUFFER_LINES=10000
      - LOKI_SINCE=0
      # Optional: use a docker proxy instead of the docker socket mount for improved security
      # - DOCKER_HOST=tcp://docker-proxy:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Optional: a docker proxy service is only needed if DOCKER_HOST is set.
  # It improves security by filtering api calls and disallowing write operations.
  # docker-proxy:
  #   image: lscr.io/linuxserver/socket-proxy:latest
  #   container_name: docker-proxy
  #   restart: always
  #   expose:
  #     - 2375
  #   environment:
  #     - CONTAINERS=1
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - 9090:9090
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert/rules.yml:/etc/prometheus/alert.yml

  alertmanager:
    image: prom/alertmanager
    container_name: alertmanager
    restart: always
    ports:
      - 9093:9093
    # Optional: setting up a proxy connection for alerts (e.g. to access the Telegram API).
    # environment:
    #   - HTTPS_PROXY=
    volumes:
      - ./prometheus/alert/alertmanager.yml:/etc/alertmanager/config.yml
      - ./prometheus/alert/telegram.tmpl:/etc/alertmanager/telegram.tmpl

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - 3100:3100
    volumes:
      - loki_data:/loki

volumes:
  grafana_data:
  prometheus_data:
  loki_data: